spring.application.name=MsAuth
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/gestman?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=gestman_user
spring.datasource.password=gestman_user
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
